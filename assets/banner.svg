<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#f0a88c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="150" cy="90" r="3" fill="#d97757" opacity="0.3"/>
  <circle cx="1050" cy="80" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="200" cy="270" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="980" cy="280" r="3" fill="#d97757" opacity="0.25"/>
  <circle cx="80" cy="180" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="1120" cy="190" r="1.5" fill="#ffffff" opacity="0.15"/>

  <!-- Decorative arc lines -->
  <path d="M 0 300 Q 300 250 600 300 Q 900 350 1200 300" fill="none" stroke="#d97757" stroke-opacity="0.06" stroke-width="1.5"/>
  <path d="M 0 80 Q 400 130 800 80 Q 1000 50 1200 90" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Small diamond accents -->
  <polygon points="250,60 255,50 260,60 255,70" fill="#d97757" opacity="0.15"/>
  <polygon points="940,310 945,300 950,310 945,320" fill="#d97757" opacity="0.15"/>

  <!-- Headline -->
  <text x="600" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">Claude Opus 5 Desktop App</tspan>
  </text>

  <!-- Accent line under headline -->
  <rect x="420" y="185" width="360" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Claude Opus 5 Desktop App Without Limits — for heavy Claude users —</tspan>
    <tspan x="600" dy="28">manage long projects, files, and context…</tspan>
  </text>

  <!-- Bottom decorative element -->
  <path d="M 500 320 L 700 320" stroke="#d97757" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="485" cy="320" r="2" fill="#d97757" opacity="0.2"/>
  <circle cx="715" cy="320" r="2" fill="#d97757" opacity="0.2"/>
</svg>